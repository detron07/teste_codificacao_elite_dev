name: casa-leiloes

services:
  postgres:
    image: postgres:16-alpine
    container_name: casa-leiloes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leilao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leilao}
      POSTGRES_DB: ${POSTGRES_DB:-casa_leiloes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leilao} -d ${POSTGRES_DB:-casa_leiloes}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
